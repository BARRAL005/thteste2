<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#050505" />
  <title>TH EMPREENDIMENTOS</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="assets/index.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <section id="authScreen" class="auth-screen">
      <div class="auth-glow"></div>
      <div class="auth-card glass">
        <div class="brand-mark">TH</div>
        <p class="eyebrow">Gestão financeira premium</p>
        <h1>TH EMPREENDIMENTOS</h1>
        <p class="muted">Controle empréstimos, juros mensais, cobranças, caixa, cartões e relatórios em um único painel.</p>
        <form id="loginForm" class="stack">
          <label>E-mail<input id="email" type="email" placeholder="seu@email.com" autocomplete="email" required /></label>
          <label>Senha<input id="password" type="password" placeholder="••••••••" autocomplete="current-password" required /></label>
          <button class="btn primary" type="submit">Entrar no sistema</button>
          <button class="btn ghost" id="createAccountBtn" type="button">Criar conta</button>
          <button class="btn text" id="demoBtn" type="button">Abrir modo demonstração</button>
        </form>
        <small id="authMessage" class="status-message"></small>
      </div>
    </section>

    <section id="mainApp" class="main-app hidden">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-top">
          <div class="brand-row"><div class="brand-mark small">TH</div><div><b>TH EMPREENDIMENTOS</b><span>Fintech Manager</span></div></div>
          <button id="closeMenu" class="icon-btn mobile-only">×</button>
        </div>
        <nav id="navMenu" class="nav-menu"></nav>
        <div class="sidebar-bottom">
          <div class="mini-card"><span>Rentabilidade média</span><strong id="sideRoi">0%</strong></div>
        </div>
      </aside>

      <main class="content">
        <header class="topbar">
          <button id="openMenu" class="icon-btn">☰</button>
          <div><p class="eyebrow" id="sectionLabel">Dashboard</p><h2 id="pageTitle">Visão geral</h2></div>
          <div class="top-actions">
            <button id="themeBtn" class="btn ghost small-btn">Claro/Escuro</button>
            <button id="logoutBtn" class="btn outline small-btn">Sair</button>
          </div>
        </header>
        <div id="viewRoot" class="view-root"></div>
      </main>
    </section>
  </div>
  <div id="toast" class="toast"></div>
  <script type="module" src="assets/app.js"></script>
</body>
</html>
